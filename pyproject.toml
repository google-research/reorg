[project]
name = "reorg"
version = "0.1.0"
description = "ReOrg: Evolving Reflective Organization Skills for Enterprise Agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # model clients (Gemini Developer API, vLLM) and data preparation
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # worker and stakeholders run on the official Stirrup agent (v0.1.11)
    "stirrup @ git+https://github.com/ArtificialAnalysis/Stirrup.git@836504b9efe9fcbd2114a9a441f4f5f92bf38ce1",
]

[project.optional-dependencies]
# Vertex AI credentials for the GDPval panel's Claude Sonnet 4.6 judge
gdpval-eval = ["google-auth[requests]>=2.0"]
# imported by harvey-labs' upstream scoring (LAB evaluation)
lab-eval = ["anthropic>=0.88", "markitdown>=0.1.5", "pdfplumber>=0.11.9", "openpyxl>=3.1.5", "python-pptx>=1.0.2"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reorg*"]

[tool.setuptools.package-data]
# prompt templates and their manifest ship with the package
reorg = ["prompts/**/*.md", "prompts/**/*.json", "prompts/*.md", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
